<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burra</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
</head>
<body>
    <!-- LOBBY VIEW -->
    <div id="lobby-view">
        <div class="lobby-container">
            <h1 class="game-title">Burra</h1>
            <p class="game-subtitle">Georgian Card Game</p>

            <div id="name-section" class="lobby-section">
                <input id="player-name" type="text" placeholder="Your name" maxlength="12" autocomplete="off">
            </div>

            <div id="room-actions" class="lobby-section">
                <button id="btn-create" class="btn btn-primary">Create Room</button>
                <div class="divider">or</div>
                <div class="join-row">
                    <input id="room-code-input" type="text" placeholder="Room code" maxlength="4" autocomplete="off">
                    <button id="btn-join" class="btn btn-secondary">Join</button>
                </div>
            </div>

            <div id="waiting-room" style="display:none">
                <h2>Room: <span id="room-code-display" class="room-code"></span></h2>
                <p class="waiting-hint">Share the code with other players</p>
                <div id="player-list"></div>
                <button id="btn-start" class="btn btn-primary" style="display:none">Start Game</button>
            </div>
        </div>
    </div>

    <!-- GAME VIEW -->
    <div id="game-view" style="display:none">
        <div id="game-table">
            <!-- Top player (partner or opponent) -->
            <div id="seat-top" class="player-area top">
                <span class="player-name"></span>
                <span class="team-badge"></span>
                <div class="card-backs"></div>
            </div>

            <!-- Left player -->
            <div id="seat-left" class="player-area left">
                <span class="player-name"></span>
                <span class="team-badge"></span>
                <div class="card-backs"></div>
            </div>

            <!-- Right player -->
            <div id="seat-right" class="player-area right">
                <span class="player-name"></span>
                <span class="team-badge"></span>
                <div class="card-backs"></div>
            </div>

            <!-- Center: trick area + stock + trump -->
            <div id="center-area">
                <div id="stock-area">
                    <div id="stock-pile">
                        <div class="card-back"></div>
                        <span id="stock-count"></span>
                    </div>
                    <div id="trump-display"></div>
                </div>
                <div id="trick-area"></div>
            </div>

            <!-- Bottom: local player's hand -->
            <div id="seat-bottom" class="player-area bottom">
                <span class="player-name"></span>
                <div id="my-hand"></div>
                <div id="action-bar">
                    <button id="btn-play" class="btn btn-play" disabled>Play</button>
                    <button id="btn-declare-bura" class="btn btn-declare" style="display:none">Declare Bura!</button>
                    <button id="btn-declare-maliutka" class="btn btn-declare" style="display:none">Declare Maliutka!</button>
                </div>
            </div>

            <!-- Scoreboard -->
            <div id="scoreboard">
                <div class="score-row">
                    <span class="score-label">Your Team</span>
                    <span id="score-mine" class="score-value">0</span>
                </div>
                <div class="score-row">
                    <span class="score-label">Opponents</span>
                    <span id="score-theirs" class="score-value">0</span>
                </div>
            </div>

            <!-- Status bar -->
            <div id="status-bar"></div>
        </div>
    </div>

    <!-- Result overlay -->
    <div id="result-overlay" style="display:none">
        <div id="result-content">
            <h2 id="result-text"></h2>
            <button id="btn-rematch" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="js/protocol.js"></script>
    <script src="js/ws.js"></script>
    <script src="js/cardUI.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/lobby.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
